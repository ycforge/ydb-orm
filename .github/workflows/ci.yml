name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # file:-зависимость @ycforge/js-dev-tools живёт в отдельном репозитории,
      # чекаутим её в путь из file:../dev-tools/js до yarn install.
      # SHA пиннут для воспроизводимости; при обновлении js-dev-tools — бампнуть.
      - uses: actions/checkout@v4
        with:
          repository: ycforge/js-dev-tools
          ref: 4485d8e84f9525ed88b41f7d1769f2fee9e0c476
          path: dev-tools/js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # file:-зависимость @ycforge/js-dev-tools живёт в отдельном репозитории,
      # чекаутим её в путь из file:../dev-tools/js до yarn install.
      # SHA пиннут для воспроизводимости; при обновлении js-dev-tools — бампнуть.
      - uses: actions/checkout@v4
        with:
          repository: ycforge/js-dev-tools
          ref: 4485d8e84f9525ed88b41f7d1769f2fee9e0c476
          path: dev-tools/js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn test:cov

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # file:-зависимость @ycforge/js-dev-tools живёт в отдельном репозитории,
      # чекаутим её в путь из file:../dev-tools/js до yarn install.
      # SHA пиннут для воспроизводимости; при обновлении js-dev-tools — бампнуть.
      - uses: actions/checkout@v4
        with:
          repository: ycforge/js-dev-tools
          ref: 4485d8e84f9525ed88b41f7d1769f2fee9e0c476
          path: dev-tools/js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
