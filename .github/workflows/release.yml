name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  ci:
    name: CI gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # file:-зависимость @ycforge/js-dev-tools живёт в отдельном репозитории,
      # чекаутим её в путь из file:../dev-tools/js до yarn install.
      # SHA пиннут для воспроизводимости; при обновлении js-dev-tools — бампнуть.
      - uses: actions/checkout@v4
        with:
          repository: ycforge/js-dev-tools
          ref: 4485d8e84f9525ed88b41f7d1769f2fee9e0c476
          path: dev-tools/js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn test
      - run: yarn build

  publish:
    name: Publish to npm
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # file:-зависимость @ycforge/js-dev-tools живёт в отдельном репозитории,
      # чекаутим её в путь из file:../dev-tools/js до yarn install.
      # SHA пиннут для воспроизводимости; при обновлении js-dev-tools — бампнуть.
      - uses: actions/checkout@v4
        with:
          repository: ycforge/js-dev-tools
          ref: 4485d8e84f9525ed88b41f7d1769f2fee9e0c476
          path: dev-tools/js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          registry-url: https://registry.npmjs.org
      - run: yarn install --frozen-lockfile
      - run: yarn build

      - name: Determine npm tag
        id: npm-tag
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "tag=beta" >> "$GITHUB_OUTPUT"
            echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "prerelease=" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        run: npm publish --tag ${{ steps.npm-tag.outputs.tag }} --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        run: gh release create "$GITHUB_REF_NAME" --generate-notes ${{ steps.npm-tag.outputs.prerelease }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
