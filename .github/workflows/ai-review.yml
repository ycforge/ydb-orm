name: AI Code Review

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - labeled

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deepseek-review:
    name: DeepSeek Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Защита от DoS и лишнего расхода токенов:
    # 1. Не запускаем на draft-PR.
    # 2. Автоматически запускаем только для OWNER/MEMBER/COLLABORATOR.
    # 3. Внешние контрибьюторы могут получить ревью только при наличии
    #    метки "ai review".
    if: |
      !github.event.pull_request.draft && (
        contains(github.event.pull_request.labels.*.name, 'ai review') ||
        github.event.pull_request.author_association == 'OWNER' ||
        github.event.pull_request.author_association == 'MEMBER' ||
        github.event.pull_request.author_association == 'COLLABORATOR'
      )

    steps:
      - name: DeepSeek Code Review
        # Пин по полному SHA коммита (#167): 'v1' — mutable тег.
        uses: hustcer/deepseek-review@eccde2e9781008d795e366b951e313e37af88dd5
        with:
          chat-token: ${{ secrets.DEEPSEEK_CHAT_TOKEN }}
          base-url: ${{ secrets.DEEPSEEK_BASE_URL }}
          model: ${{ vars.DEEPSEEK_MODEL || 'deepseek/deepseek-v4-flash' }}
          max-length: 360000
          exclude-patterns: 'pnpm-lock.yaml,package-lock.json,yarn.lock,*.lock,dist/**,coverage/**,node_modules/**,*.min.js,*.min.css'

          sys-prompt: |
            Весь ответ должен быть на русском языке.

            Ты выполняешь code review TypeScript ORM-проекта.

            Анализируй изменения Pull Request и сообщай только о реальных,
            существенных проблемах:
            - баги и логические ошибки;
            - регрессии;
            - проблемы безопасности;
            - ошибки TypeScript;
            - проблемы SQL/ORM;
            - проблемы транзакций, async/await и управления ресурсами;
            - существенные edge cases.

            Не сообщай о стиле, форматировании, naming, субъективных
            архитектурных предпочтениях и мелких улучшениях.

            Будь кратким и конкретным.
            Максимум 5 замечаний.
            Каждое замечание должно быть коротким и содержать проблему
            и способ исправления.

            Не пересказывай Pull Request и не показывай процесс анализа.

            Не ищи проблемы ради самого факта review: если недостаток
            не является существенным, не включай его.

            Весь ответ, кроме технических идентификаторов, должен быть
            на русском языке.

            В конце добавь ровно одну строку:

            `Можно мёрджить ✅`

            если существенных проблем нет;

            `Нужна доработка ❓`

            только в исключительном пограничном случае, примерно 50/50,
            когда есть реальная проблема, требующая небольшой локальной
            доработки;

            `Нельзя мёрджить, нужно переработать ❌`

            если есть существенные проблемы, требующие заметной
            переработки.

            Если сомнение вызвано только мелким или субъективным
            недостатком, выбирай `Можно мёрджить ✅`.

            Весь итоговый ответ должен быть только на русском языке.

          user-prompt: |
            Проведи code review изменений Pull Request.
            Ответ дай на русском языке.
            Будь кратким и сообщай только о существенных проблемах.
