name: AI Code Review

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - labeled

permissions:
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deepseek-review:
    name: DeepSeek Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Защита от DoS и лишнего расхода токенов:
    # 1. Не запускаем на draft-PR.
    # 2. Автоматически запускаем только для OWNER/MEMBER/COLLABORATOR.
    # 3. Внешние контрибьюторы могут получить ревью, только если мейнтейнер
    #    повесит метку "ai review" (триггер labeled).
    # 4. Ограничиваем размер diff (max-length) и исключаем lock/генерируемые файлы.
    if: |
      !github.event.pull_request.draft && (
        contains(github.event.pull_request.labels.*.name, 'ai review') ||
        github.event.pull_request.author_association == 'OWNER' ||
        github.event.pull_request.author_association == 'MEMBER' ||
        github.event.pull_request.author_association == 'COLLABORATOR'
      )
    steps:
      - name: DeepSeek Code Review
        uses: hustcer/deepseek-review@v1
        with:
          # Токен, endpoint и модель задаются через секреты/переменные репозитория,
          # чтобы можно было подключить собственного агента/провайдера.
          chat-token: ${{ secrets.DEEPSEEK_CHAT_TOKEN }}
          base-url: ${{ secrets.DEEPSEEK_BASE_URL }}
          model: ${{ vars.DEEPSEEK_MODEL || 'deepseek/deepseek-v4-flash' }}
          max-length: 360000
          exclude-patterns: 'pnpm-lock.yaml,package-lock.json,yarn.lock,*.lock,dist/**,coverage/**,node_modules/**,*.min.js,*.min.css'
          sys-prompt: |
            Ты — внимательный ассистент по code review для TypeScript ORM-проекта.
            Анализируй изменения в pull request и сообщай ТОЛЬКО о реальных проблемах на русском языке.
            Пиши предельно сжато, соблюдай строгие ограничения:
            - Не пересказывай, что делает PR, не пиши вступлений, заключений и похвалы.
            - Не отмечай стилистику, именование, форматирование и вкусовые предпочтения.
            - Отмечай только: баги и логические ошибки; проблемы безопасности (SQL, шифрование,
              авторизация); сломанную типизацию TypeScript; необработанные крайние случаи;
              отсутствие тестов на новую нетривиальную логику; регрессии.
            - Максимум 5 замечаний. Каждое — один пункт формата `file:line — проблема → как исправить`
              в одну-две строки. Если замечаний больше 5, оставь самые серьёзные.
            - Если существенных проблем нет — ответь ровно одной строкой:
              `Существенных замечаний нет.`

            В конце ответа обязательно добавь ровно одну скрытую HTML-строку:
            - `<!-- AI_REVIEW_SEVERITY: CRITICAL -->` если есть критические или блокирующие проблемы.
            - `<!-- AI_REVIEW_SEVERITY: OK -->` если критических проблем нет.
            Не объясняй назначение этой строки и не показывай её как отдельный видимый элемент.
          user-prompt: |
            Проведи code review следующих изменений. Ответ — только список существенных проблем
            (не более 5 пунктов по 1–2 строки), без пересказа изменений и без общих слов.
            Если всё в порядке — одна строка «Существенных замечаний нет.»

      - name: Check for critical issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          echo "Waiting for the AI review to be posted..."
          sleep 5

          pr_number="${{ github.event.pull_request.number }}"
          repo="${{ github.repository }}"

          echo "Fetching PR reviews..."
          # gh api не поддерживает флаг -r; забираем JSON-массив тел review и ищем маркер в нём.
          review_bodies=$(gh api "repos/${repo}/pulls/${pr_number}/reviews" --jq '[.[].body]')

          if echo "$review_bodies" | grep -q 'AI_REVIEW_SEVERITY: CRITICAL'; then
            echo "::error::AI review detected CRITICAL issues. Failing the workflow."
            exit 1
          fi

          if echo "$review_bodies" | grep -q 'AI_REVIEW_SEVERITY: OK'; then
            echo "AI review found no critical issues."
          else
            echo "::warning::Severity marker not found in AI review; cannot determine critical status. Continuing without failure."
          fi
