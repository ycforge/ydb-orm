name: AI Code Review

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - labeled

permissions:
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deepseek-review:
    name: DeepSeek Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Защита от DoS и лишнего расхода токенов:
    # 1. Не запускаем на draft-PR.
    # 2. Автоматически запускаем только для OWNER/MEMBER/COLLABORATOR.
    # 3. Внешние контрибьюторы могут получить ревью, только если мейнтейнер
    #    повесит метку "ai review" (триггер labeled).
    # 4. Ограничиваем размер diff (max-length) и исключаем lock/генерируемые файлы.
    if: |
      !github.event.pull_request.draft && (
        contains(github.event.pull_request.labels.*.name, 'ai review') ||
        github.event.pull_request.author_association == 'OWNER' ||
        github.event.pull_request.author_association == 'MEMBER' ||
        github.event.pull_request.author_association == 'COLLABORATOR'
      )
    steps:
      - name: DeepSeek Code Review
        uses: hustcer/deepseek-review@v1
        with:
          # Токен, endpoint и модель задаются через секреты/переменные репозитория,
          # чтобы можно было подключить собственного агента/провайдера.
          chat-token: ${{ secrets.DEEPSEEK_CHAT_TOKEN }}
          base-url: ${{ secrets.DEEPSEEK_BASE_URL }}
          model: ${{ vars.DEEPSEEK_MODEL || 'deepseek/deepseek-v4-flash' }}
          max-length: 360000
          exclude-patterns: 'pnpm-lock.yaml,package-lock.json,yarn.lock,*.lock,dist/**,coverage/**,node_modules/**,*.min.js,*.min.css'
          sys-prompt: |
            Ты — code reviewer для TypeScript ORM-проекта.
            Анализируй именно изменения в pull request, но при необходимости
            проверяй окружающий код, чтобы понять их фактическое поведение.

            Сообщай только о существенных и обоснованных проблемах, которые
            действительно могут привести к:
            - багу, неверному результату или логической ошибке;
            - регрессии существующего поведения;
            - проблеме безопасности, особенно в SQL, авторизации,
              обработке данных или криптографии;
            - ошибке TypeScript-типизации, способной повлиять на runtime или API;
            - необработанному важному edge case;
            - проблеме с транзакциями, async-поведением, соединениями,
              ORM-маппингом или формированием запросов;
            - отсутствию теста только тогда, когда без него высок риск
              незаметной регрессии новой нетривиальной логики.

            Не придирайся к стилю, именованию, форматированию, архитектурным
            предпочтениям и субъективным улучшениям. Не предлагай рефакторинг
            сам по себе, если текущий код корректен.

            Не сообщай о проблеме без конкретного основания.
            Для каждого замечания должна быть понятна причинно-следственная
            связь: что именно в изменении не так, при каком сценарии это
            проявится и какое минимальное исправление требуется.

            Приоритет замечаний:
            1. critical/high — баги, безопасность, потеря данных, неверные
               транзакции, поломка публичного поведения;
            2. medium — существенные edge cases и регрессии;
            3. low — только если проблема объективна и практически значима.

            Максимум 5 замечаний. Выбирай самые важные; не разбивай одну
            проблему на несколько пунктов и не повторяй одну и ту же мысль.

            Формат каждого замечания:
            `file:line — проблема`
            Далее 1–2 коротких предложения с причиной/сценарием и
            конкретным способом исправления.

            Не пересказывай PR, не пиши вступлений, заключений, похвалы
            или общего резюме. Не цитируй большие фрагменты кода.

            Общий ответ должен быть компактным: ориентир — не более 300 слов
            без скрытого служебного маркера.

            Если существенных проблем нет — ответь ровно одной строкой:
            `Существенных замечаний нет.`

            В конце ответа обязательно добавь ровно одну скрытую HTML-строку:
            - `<!-- AI_REVIEW_SEVERITY: CRITICAL -->` если есть хотя бы одна
              critical/high проблема, способная блокировать merge;
            - `<!-- AI_REVIEW_SEVERITY: OK -->` если таких проблем нет.
            Не объясняй назначение этой строки и не показывай её как отдельный
            видимый элемент.

          user-prompt: |
            Проведи code review этих изменений.

            Ищи только реальные, существенные проблемы. Сначала оцени
            корректность и возможные регрессии, затем безопасность,
            TypeScript/типизацию, edge cases, ORM/SQL/транзакционное
            поведение и, только при наличии существенного риска, тестовое
            покрытие.

            Для каждого найденного дефекта укажи:
            `file:line — проблема`
            и 1–2 коротких предложения: почему это проблема и как её
            исправить.

            Не пересказывай изменения и не добавляй общих рекомендаций.
            Максимум 5 наиболее важных замечаний, общий объём — не более
            300 слов.

            Если существенных проблем нет — одна строка:
            `Существенных замечаний нет.`

      - name: Check for critical issues
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        shell: bash
        run: |
          set -euo pipefail

          echo "Checking the latest AI review for PR #${PR_NUMBER}..."

          # DeepSeek action may need a moment to publish the review.
          # Retry instead of relying on a single fixed sleep.
          for attempt in {1..12}; do
            reviews="$(
              gh api \
                --paginate \
                "repos/${REPO}/pulls/${PR_NUMBER}/reviews?per_page=100" \
                --jq '
                  .[]
                  | select(.user.login | endswith("[bot]"))
                  | select(.body != null)
                  | select(.commit_id != null)
                  | {
                      id,
                      user: .user.login,
                      body,
                      commit_id,
                      submitted_at
                    }
                '
            )"

            # The API returns reviews chronologically, so the last matching
            # review is the newest one.
            latest_ai_review="$(
              printf '%s\n' "$reviews" |
                jq -s --arg sha "$HEAD_SHA" '
                  map(select(.commit_id == $sha))
                  | sort_by(.submitted_at)
                  | last
                '
            )"

            if [[ "$latest_ai_review" != "null" ]]; then
              break
            fi

            if [[ "$attempt" -eq 12 ]]; then
              echo "::error::No AI review for the current commit (${HEAD_SHA}) was found."
              exit 1
            fi

            echo "AI review not found yet (attempt ${attempt}/12), retrying..."
            sleep 5
          done

          review_id="$(jq -r '.id' <<< "$latest_ai_review")"
          review_user="$(jq -r '.user' <<< "$latest_ai_review")"
          review_commit="$(jq -r '.commit_id' <<< "$latest_ai_review")"
          review_body="$(jq -r '.body' <<< "$latest_ai_review")"

          echo "Found AI review #${review_id} from ${review_user} for commit ${review_commit}."

          if grep -Fq 'AI_REVIEW_SEVERITY: CRITICAL' <<< "$review_body"; then
            echo "::error::AI review detected CRITICAL issues."
            exit 1
          fi

          if grep -Fq 'AI_REVIEW_SEVERITY: OK' <<< "$review_body"; then
            echo "AI review found no critical issues."
            exit 0
          fi

          echo "::error::AI review does not contain a valid severity marker."
          exit 1
