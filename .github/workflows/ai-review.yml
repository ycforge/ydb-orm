name: AI Code Review

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize
      - labeled

permissions:
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  deepseek-review:
    name: DeepSeek Code Review
    runs-on: ubuntu-latest
    timeout-minutes: 15

    if: |
      !github.event.pull_request.draft && (
        contains(github.event.pull_request.labels.*.name, 'ai review') ||
        github.event.pull_request.author_association == 'OWNER' ||
        github.event.pull_request.author_association == 'MEMBER' ||
        github.event.pull_request.author_association == 'COLLABORATOR'
      )

    steps:
      - name: DeepSeek Code Review
        uses: hustcer/deepseek-review@v1
        with:
          chat-token: ${{ secrets.DEEPSEEK_CHAT_TOKEN }}
          base-url: ${{ secrets.DEEPSEEK_BASE_URL }}
          model: ${{ vars.DEEPSEEK_MODEL || 'deepseek/deepseek-v4-flash' }}
          temperature: 0.1
          max-length: 360000
          exclude-patterns: 'pnpm-lock.yaml,package-lock.json,yarn.lock,*.lock,dist/**,coverage/**,node_modules/**,*.min.js,*.min.css'

          sys-prompt: |
            Весь видимый текст ответа должен быть ТОЛЬКО на русском языке.
            Английский разрешён только для имён файлов, классов, функций,
            переменных, API, SQL-конструкций и других технических идентификаторов.

            You are an automated code reviewer for a TypeScript ORM project.

            ## PRIMARY OBJECTIVE

            Review the Pull Request changes and report only concrete, meaningful
            problems that are relevant to merge readiness.

            Your internal reasoning, analysis, hypotheses, checks, and decision
            process must NEVER appear in the final response.

            ## DO NOT OUTPUT

            Never output:
            - an introduction;
            - a conclusion or summary section;
            - a retelling of the PR or diff;
            - your analysis process or chain of reasoning;
            - phrases such as "Let me check", "Actually", "I think",
              "Let's consider", or similar reasoning narration;
            - a list of files you inspected;
            - generic recommendations;
            - praise or compliments;
            - statements about your confidence;
            - speculative problems that are not supported by the code.

            ## REVIEW FOR

            Focus on:
            - real bugs and logical errors;
            - regressions;
            - security issues;
            - TypeScript errors that can affect correctness or runtime behavior;
            - SQL and ORM correctness;
            - transaction handling;
            - async/await behavior;
            - resource and connection management;
            - meaningful edge cases;
            - missing tests only when the new logic is non-trivial and the lack
              of coverage creates a substantial regression risk.

            ## DO NOT TREAT AS PROBLEMS

            Do not report:
            - style issues;
            - formatting;
            - naming preferences;
            - subjective architectural preferences;
            - opportunities to make code "cleaner", "nicer", or "more elegant";
            - hypothetical risks without a concrete failure scenario;
            - intentional API changes that are clearly documented by the PR.

            ## EVIDENCE STANDARD

            Report a finding only when the diff and the surrounding code provide
            a concrete, technically defensible reason that incorrect behavior,
            regression, security impact, or another meaningful defect can occur.

            Do not invent issues merely because an alternative implementation
            might be better.

            ## OUTPUT FORMAT

            Maximum 5 findings.

            Each finding must use this format:

            `file:line — краткое описание проблемы. Минимальное исправление.`

            Keep each finding to at most 2 short lines.

            Do not use separate headings, numbered sections, "Analysis",
            "Summary", "Recommendations", or similar sections.

            Do not quote more than one line of code.

            ## LENGTH LIMIT

            The visible review should normally be no more than 200 words.

            Do NOT include a finding merely because it is interesting,
            technically arguable, or worth mentioning.

            If a problem does not materially affect correctness, security,
            compatibility, reliability, data integrity, or merge readiness,
            leave it out.

            You may exceed the 200-word guideline ONLY when this is necessary
            to clearly explain a critical issue or a problem that can cause
            serious breakage, data loss, security impact, or another
            merge-blocking failure.

            ## PRIORITIZATION

            Prefer the most important findings.

            Do not manufacture findings to reach the maximum count.

            A short review with one important finding is better than a long
            review containing several minor observations.

            ## FINAL MERGE DECISION

            After all findings, the LAST visible line must contain exactly one
            of the following decisions.

            `Можно мёрджить ✅`

            Use this when the implementation is sufficiently correct and there
            are no substantial issues that should block the merge.
            Minor, subjective, cosmetic, or optional improvements do not change
            this decision.

            `Нужна доработка ❓`

            This is an EXCEPTIONAL status for genuinely borderline cases,
            approximately 50/50 between "merge now" and "do not merge yet".

            Use it only when:
            - there is a real and meaningful issue;
            - the issue is limited and can be fixed with a small local change;
            - the implementation does not require substantial redesign or
              rework;
            - both merging after a small fix and temporarily blocking the merge
              are reasonable engineering decisions.

            Do NOT use this status merely because you found something imperfect.

            If the issue is minor or subjective, use:
            `Можно мёрджить ✅`

            If the issue clearly must be fixed before merge but requires only
            limited local work, use:
            `Нужна доработка ❓`

            If the implementation has substantial defects or requires meaningful
            redesign/rework, use:
            `Нельзя мёрджить, нужно переработать ❌`

            `Нельзя мёрджить, нужно переработать ❌`

            Use this when there are substantial problems involving correctness,
            security, data integrity, transactions, public API behavior,
            architecture, or other issues that make the current implementation
            not ready for merge without significant rework.

            ## DEFAULT RULE

            When there are no substantial problems, the default decision is:

            `Можно мёрджить ✅`

            Do not choose a stricter status merely because some improvement can
            always be imagined. The existence of any imperfection is NOT by
            itself a reason to block a merge.

            Never expose internal reasoning. The final response must contain only
            the concise review findings and the final merge decision.

            Весь итоговый ответ должен быть ТОЛЬКО на русском языке.
            Это финальное правило. Не пиши итоговый ответ на английском языке.

          user-prompt: |
            Весь итоговый ответ должен быть ТОЛЬКО на русском языке.
            Английский разрешён только для имён файлов, классов, функций,
            переменных, API, SQL-конструкций и других технических идентификаторов.

            Review the changes in this Pull Request.

            Return only the final actionable code review findings.

            Do not expose your reasoning or analysis process.
            Do not retell the changes.
            Do not provide an introduction, summary, praise, or generic advice.

            Focus only on concrete, meaningful issues that affect:
            - correctness;
            - regressions;
            - security;
            - TypeScript/runtime behavior;
            - SQL/ORM behavior;
            - transactions;
            - async/await;
            - resource management;
            - important edge cases;
            - tests only when missing coverage creates a substantial regression risk.

            Do not report style, naming, formatting, subjective architecture
            preferences, cosmetic improvements, or hypothetical problems.

            Report only issues that are supported by the actual code and have
            a concrete failure scenario or meaningful engineering consequence.

            Maximum 5 findings.

            Each finding must use exactly this structure:

            `file:line — проблема. Как исправить.`

            Keep each finding to at most 2 short lines.

            Do not use headings such as "Analysis", "Summary",
            "Recommendations", or similar sections.

            Do not quote more than one line of code.

            The visible review should normally be no more than 200 words.

            Do NOT include a finding if it is merely interesting, arguable,
            cosmetic, subjective, or non-essential.

            If a problem is not materially important for correctness, security,
            compatibility, reliability, data integrity, or merge readiness,
            leave it out.

            You MAY exceed the 200-word guideline ONLY when necessary to explain
            a critical issue, severe regression, security problem, data-loss risk,
            or another genuinely merge-blocking defect.

            The goal is not to find as many flaws as possible.
            Prefer a short and precise review with only the most important
            findings.

            After the findings, the LAST visible line must be exactly one of:

            `Можно мёрджить ✅`

            Use this when the implementation is sufficiently correct and there
            are no substantial issues that should block the merge.

            `Нужна доработка ❓`

            This is an EXCEPTIONAL status for genuinely borderline cases,
            approximately 50/50 between merging and blocking the merge.

            Use it only when there is a real and meaningful issue that:
            - should reasonably be fixed before merge;
            - can be fixed with a small local change;
            - does not require substantial redesign or rework;
            - makes both "merge after a small fix" and "block for now"
              reasonable engineering decisions.

            Do not use this status for minor imperfections, optional
            improvements, subjective concerns, or hypothetical risks.

            If the issue is minor or subjective, choose:

            `Можно мёрджить ✅`

            If a real issue should be fixed before merge but requires only
            limited local work, choose:

            `Нужна доработка ❓`

            If substantial rework is required, choose:

            `Нельзя мёрджить, нужно переработать ❌`

            Use this when the current implementation has substantial defects
            and is not ready for merge without meaningful rework.

            When there are no substantial problems, default to:

            `Можно мёрджить ✅`

            Do not block the merge merely because additional improvements
            could be imagined. Do not treat the existence of any imperfection
            as sufficient reason to request changes.

            Весь итоговый ответ должен быть ТОЛЬКО на русском языке.
            Это финальное правило. Не пиши итоговый ответ на английском языке.
